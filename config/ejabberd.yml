###
###'           ejabberd configuration file
###'           ejabberd 26.x
###'           modified for use with xmp.pm
###'           xmp.pm XMPP service config
###
###

### The parameters used in this configuration file are explained in more detail
### in the ejabberd Installation and Operation Guide.
### Please consult the Guide in case of doubts, it is included with
### your copy of ejabberd, and is also available online at
### http://www.process-one.net/en/ejabberd/docs/

### The configuration file is written in YAML.
### Refer to http://en.wikipedia.org/wiki/YAML for the brief description.
### However, ejabberd treats different literals as different types:
###
### - unquoted or single-quoted strings. They are called "atoms".
###   Example: dog, 'Jupiter', '3.14159', YELLOW
###
### - numeric literals. Example: 3, -45.0, .0
###
### - quoted or folded strings.
###   Examples of quoted string: "Lizzard", "orange".
###   Example of folded string:
###   > Art thou not Romeo,
###     and a Montague?

###.  =======
###'  LOGGING

##
## loglevel: Verbosity of log files generated by ejabberd.
## 0: No ejabberd log at all (not recommended)
## 1: Critical
## 2: Error
## 3: Warning
## 4: Info
## 5: Debug
##
loglevel: 3

##
## rotation: Describe how to rotate logs. Either size and/or date can trigger
## log rotation. Setting count to N keeps N rotated logs. Setting count to 0
## does not disable rotation, it instead rotates the file and keeps no previous
## versions around. Setting size to X rotate log when it reaches X bytes.
## To disable rotation set the size to 0 and the date to ""
## Date syntax is taken from the syntax newsyslog uses in newsyslog.conf.
## Some examples:
##  $D0     rotate every night at midnight
##  $D23    rotate every day at 23:00 hr
##  $W0D23  rotate every week on Sunday at 23:00 hr
##  $W5D16  rotate every week on Friday at 16:00 hr
##  $M1D0   rotate on the first day of every month at midnight
##  $M5D6   rotate on every 5th day of the month at 6:00 hr
##
# log_rotate_size: 10485760
# log_rotate_count: 1

##
## overload protection: If you want to limit the number of messages per second
## allowed from error_logger, which is a good idea if you want to avoid a flood
## of messages when system is overloaded, you can set a limit.
## 100 is ejabberd's default.
# log_rate_limit: 100

## Do not log IP address or sensitive data
hide_sensitive_log_data: true

##
## watchdog_admins: Only useful for developers: if an ejabberd process
## consumes a lot of memory, send live notifications to these XMPP
## accounts.
##
## watchdog_admins:
##   - "admin@reddemon"

###.  ===============
###'  NODE PARAMETERS

##
## net_ticktime: Specifies net_kernel tick time in seconds. This options must have
## identical value on all nodes, and in most cases shouldn't be changed at all from
## default value.
##
## net_ticktime: 60

###.  ================
###'  SERVED HOSTNAMES

##
## hosts: Domains served by ejabberd.
## You can define one or several, for example:
## hosts:
##   - "example.net"
##   - "example.com"
##   - "example.org"
##
hosts:
  - "xmp.pm"

##
## route_subdomains: Delegate subdomains to other XMPP servers.
## For example, if this ejabberd serves example.org and you want
## to allow communication with an XMPP server called im.example.org.
##
## route_subdomains: s2s

###.  ============
###'  Certificates

## List all available PEM files containing certificates for your domains,
## chains of certificates or certificate keys. Full chains will be built
## automatically by ejabberd.
##
certfiles:
  # ejabberd expects a PEM that contains the certificate chain and matching private key.
  - "/etc/ssl/certs/ejabberd/fullchain.pem"
##   - "/etc/letsencrypt/live/example.org/*.pem"
##   - "/etc/letsencrypt/live/example.com/*.pem"

#ca_file: "/opt/ejabberd/conf/cacert.pem"

###.  =================
###'  TLS configuration

## Note that the following configuration is the default
## configuration of the TLS driver, so you don't need to
## uncomment it.
##
## define_macro:
##   'TLS_CIPHERS': "HIGH:!aNULL:!eNULL:!3DES:@STRENGTH"
##   'TLS_OPTIONS':
##     - "no_sslv3"
##     - "cipher_server_preference"
##     - "no_compression"
##   'DH_FILE': "/opt/ejabberd-18.09/conf/dhparams.pem" # generated with: openssl dhparam -out dhparams.pem 2048
##
## c2s_dhfile: 'DH_FILE'
s2s_dhfile: '/usr/local/etc/ejabberd/dh2048.pem'
## c2s_ciphers: 'TLS_CIPHERS'
s2s_ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256"
## c2s_protocol_options: 'TLS_OPTIONS'
## s2s_protocol_options: 'TLS_OPTIONS'

###.  ===============
###'  LISTENING PORTS

## non-extensive explanation of each port:
##  - 5222 for c2s (also at `dig srv _xmpp-client._tcp.xmp.pm`)
##  - 5223 for c2s with tls enforced (same dig command, but _xmpps as prefix)
##  - 5269 for s2s (also at `dig srv _xmpp-server._tcp.xmp.pm`)
##  - 5270 for s2s with tls enforced
##  - 5280 for ejabberd's http methods (websockets, both, oauth, api)
##  - 5281 for ejabberd's http with tls enabled
##  - 5443 for ejabberd's http with tls enabled (http upload happens here)
##  - 3478 for STUN/TURN
##  - 5349 for STUN/TURN with TLS

listen:
  -
    # c2s with starttls
    port: 5222
    ip: "::"
    module: ejabberd_c2s
    protocol_options:
      - no_sslv2
      - no_sslv3
      - no_tlsv1
      - no_tlsv1_1
    ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256"
    ## To enforce TLS encryption for client connections,
    ## use this instead of the "starttls" option:
    starttls_required: true
    ## Stream compression
    ##
    ## zlib: true
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    dhfile: /usr/local/etc/ejabberd/dh2048.pem
  -
    ## main s2s
    port: 5269
    ip: "::"
    module: ejabberd_s2s_in
    max_stanza_size: 524288
    shaper: s2s_shaper
  -
    ## s2s with tls enforced
    port: 5270
    ip: "::"
    module: ejabberd_s2s_in
    max_stanza_size: 524288
    shaper: s2s_shaper
    tls: true

  -
    port: 5280
    ip: "172.17.0.1"
    module: ejabberd_http
    tls: true
    request_handlers:
      "/ws": ejabberd_http_ws
      "/http-bind": mod_bosh
      "/captcha": ejabberd_captcha
    ##  "/pub/archive": mod_http_fileserver   
    ## register: true
  -
    ## STUN/TURN
    port: 3478
    ip: "::"
    transport: udp
    module: ejabberd_stun
    use_turn: true
    turn_ipv4_address: VPS_IPV4_ADDRESS  # xmp.pm: set this to your public IPv4
    turn_ipv6_address: VPS_IPV6_ADDRESS # xmp.pm: set this to your public IPv6 (if you have one)
  -
    port: 3478
    ip: "::"
    module: ejabberd_stun
    use_turn: true
    turn_ipv4_address: VPS_IPV4_ADDRESS   # xmp.pm: set this to your public IPv4
    turn_ipv6_address: VPS_IPV6_ADDRESS  # xmp.pm: set this to your public IPv6 (if you have one)
  -
    port: 5349
    ip: "::"
    module: ejabberd_stun
    tls: true
    # certfile: /etc/ssl/ejabberd/fullchain.cer  # xmp.pm: set this to your cert file
    use_turn: true
    turn_ipv4_address: VPS_IPV4_ADDRESS  # xmp.pm: set this to your public IPv4
    turn_ipv6_address: VPS_IPV6_ADDRESS  # xmp.pm: set this to your public IPv6 (if you have one)

  -
    port: 5281
    ip: "172.17.0.1"
    module: ejabberd_http
    tls: true
    request_handlers:
      "/http-bind": mod_bosh
      "/captcha": ejabberd_captcha
    # web_admin: true
    ## register: true

  -
    port: 5444
    ip: "127.0.0.1"
    module: ejabberd_http
    tls: true
    request_handlers:
      "/admin": ejabberd_web_admin
      "/api": mod_http_api

  ##
  ## Direct-TLS for C2S (XEP-0368). A good practice is to forward
  ## traffic from port 443 to this port, possibly multiplexing it
  ## with HTTP using e.g. sslh [https://wiki.xmpp.org/web/Tech_pages/XEP-0368],
  ## so modern clients can bypass restrictive firewalls (in airports, hotels, etc.).
  ##
  -
    port: 5223
    ip: "::"
    module: ejabberd_c2s
    tls: true
    max_stanza_size: 65536
    shaper: c2s_shaper
    access: c2s

  ##
  ## To enable secure http upload
  ##
  -
    port: 5443
    ip: "172.17.0.1"
    module: ejabberd_http
    request_handlers:
      "/upload": mod_http_upload
    tls: true
    custom_headers:
      "Access-Control-Allow-Origin": "*"
      "Access-Control-Allow-Methods": "OPTIONS, HEAD, GET, POST, PUT"
      "Access-Control-Allow-Headers": "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
      "Access-Control-Expose-Headers": "Content-Length,Content-Range,Content-Type"
    # protocol_options: 'TLS_OPTIONS'
    # dhfile: 'DH_FILE'
    # ciphers: 'TLS_CIPHERS'

  ##
  ## To enable MQTT
  ##
  -
    port: 1883
    ip: "::"
    module: mod_mqtt
    backlog: 1000

## Disabling digest-md5 SASL authentication. digest-md5 requires plain-text
## password storage (see auth_password_format option).
## disable_sasl_mechanisms: "digest-md5"

###.  ==================
###'  S2S GLOBAL OPTIONS

##
## s2s_use_starttls: Enable STARTTLS for S2S connections.
## Allowed values are: false, optional or required
## You must specify 'certfiles' option
##
s2s_use_starttls: required

##
## S2S whitelist or blacklist
##
## Default s2s policy for undefined hosts.
##
s2s_access: s2s

##
## Outgoing S2S options
##
## Preferred address families (which to try first) and connect timeout
## in seconds.
##
outgoing_s2s_families:
  - ipv4
  - ipv6
## outgoing_s2s_timeout: 190

###.  ==============
###'  AUTHENTICATION

##
## auth_method: Method used to authenticate the users.
## The default method is the internal.
## If you want to use a different method,
## comment this line and enable the correct ones.
##
auth_method: internal

##
## Store the plain passwords or hashed for SCRAM:
## auth_password_format: plain
auth_password_format: scram

##
## Define the FQDN if ejabberd doesn't detect it:
## fqdn: "server3.example.com"

##
## Authentication using external script
## Make sure the script is executable by ejabberd.
##
## auth_method: external
## extauth_program: "/path/to/authentication/script"

###.  ==============
###'  DATABASE SETUP

## ejabberd by default uses the internal Mnesia ejabberd@localhost,
## so you do not necessarily need this section.
## This section provides configuration examples in case
## you want to use other ejabberd@localhost backends.
## Please consult the ejabberd Guide for details on ejabberd@localhost creation.

# Set the default option for modules to SQL
default_db: sql

##
## MySQL server:
##
## sql_type: mysql
## sql_server: "server"
## sql_ejabberd@localhost: ""
## sql_username: "username"
## sql_password: "password"
##
## If you want to specify the port:
## sql_port: 1234

##
## PostgreSQL server:
##
sql_type: pgsql
#sql_server: "localhost"
#sql_database: "ejabberd"
#sql_ejabberd@localhost: "ejabberd"
#sql_username: "ejabberd"
sql_password: "PASSWORD"  ## xmp.pm: set this to your pgsql password
## If you want to specify the port:
#sql_port: 5432
##
## If you use PostgreSQL, have a large ejabberd@localhost, and need a
## faster but inexact replacement for "select count(*) from users"
##
## pgsql_users_number_estimate: true

##
## SQLite:
##
## sql_type: sqlite
## sql_ejabberd@localhost: "/opt/ejabberd-18.09//ejabberd.db"

##
## ODBC compatible or MSSQL server:
##
## sql_type: odbc
## sql_server: "DSN=ejabberd;UID=ejabberd;PWD=ejabberd"

##
## Number of connections to open to the ejabberd@localhost for each virtual host
##
## sql_pool_size: 10

##
## Interval to make a dummy SQL request to keep the connections to the
## ejabberd@localhost alive. Specify in seconds: for example 28800 means 8 hours
##
## sql_keepalive_interval: undefined

##
## Use the new SQL schema
##
new_sql_schema: false

###.  ===============
###'  TRAFFIC SHAPERS

## define shapers (values are in bytes per second)
shaper:
  ##
  ## The "normal" shaper limits traffic speed to 1000 B/s
  ##
  normal: 1000

  ##
  ## The "fast" shaper limits traffic speed to 50000 B/s
  ##
  fast: 50000

##
## This option specifies the maximum number of elements in the queue
## of the FSM. Refer to the documentation for details.
##
max_fsm_queue: 10000

###.   ====================
###'   ACCESS CONTROL LISTS
acl:
  ##
  ## The 'admin' ACL grants administrative privileges to XMPP accounts.
  ## You can put here as many accounts as you want.
  ##
  admin:
    user:
      - "admin@xmp.pm"
      # - "admin2@xmp.pm"

  ##
  ## Blocked users
  ##
  ## blocked:
  ##   user:
  ##     - "baduser@example.org"
  ##     - "test"

  ## Local users: don't modify this.
  ##
  local:
    user_regexp: ""

  ##
  ## More examples of ACLs
  ##
  ## jabberorg:
  ##   server:
  ##     - "jabber.org"
  ## aleksey:
  ##   user:
  ##     - "aleksey@jabber.ru"
  ## test:
  ##   user_regexp: "^test"
  ##   user_glob: "test*"

  ##
  ## Loopback network
  ##
  loopback:
    ip:
      - "127.0.0.0/8"
      - "::1/128"
      - "::FFFF:127.0.0.1/128"

  ##
  ## Bad XMPP servers
  ## Based on https://github.com/JabberSPAM/blacklist
  ##
  bad_servers:
    server:
      - "bashtel.ru"
      - "creep.im"
      - "darkengine.biz"
      - "default.rs"
      - "hiddenlizard.org"
      - "jabber.bitactive.com"
      - "jabber.cd"
      - "jabber.freenet.de"
      - "jabber.ipredator.se"
      - "jabber.npw.net"
      - "jabber.sampo.ru"
      - "labas.biz"
      - "otr.chat"
      - "paranoid.scarab.name"
      - "rassnet.org"
      - "safetyjabber.com"
      - "sj.ms"
      - "xmpp.bytesund.biz"


##
## Define specific ACLs in a virtual host.
##
## host_config:
##   "localhost":
##     acl:
##       admin:
##         user:
##           - "bob-local@localhost"

###.  ============
###'  SHAPER RULES

shaper_rules:
  ## Maximum number of simultaneous sessions allowed for a single user:
  max_user_sessions: 10

  ## Maximum number of offline messages that users can have:
  max_user_offline_messages:
    - 5000: admin
    - 100

  ## For C2S connections, all users except admins use the "normal" shaper
  c2s_shaper:
    - none: admin
    - normal

  ## Limit storage of users to 100MiB before old files start to get removed
  soft_upload_quota:
    - 75: all # MiB
  hard_upload_quota:
    - 100: all # MiB
  ## All S2S connections use the "fast" shaper
  s2s_shaper: fast

###.  ============
###'  ACCESS RULES

## define access rules for other parts of this configuration to use
access_rules:
  ## This rule allows access only for local users:
  local:
    - allow: local
  ## Only non-blocked users can use c2s connections:
  c2s:
    - deny: blocked
    - allow
  ## Only admins can send announcement messages:
  announce:
    - allow: admin
  ## Only admins can use the configuration interface:
  configure:
    - allow: admin
  ## Only accounts of the local ejabberd server can create rooms:
  muc_create:
    - allow: local
  ## Only accounts on the local ejabberd server can create Pubsub nodes:
  pubsub_createnode:
    - allow: local
  ## Account creation is invite-only. Admins can create invites/accounts.
  register:
    - allow: admin
  allnetworks:
    - allow
  trusted_network:
    - allow: loopback
  ## Do not establish S2S connections with bad servers
  ## If you enable this you also have to uncomment "s2s_access: s2s"
  s2s:
    - deny:
      - acl: bad_servers
    - allow

## ===============
## API PERMISSIONS
## ===============
##
## This section allows you to define who and using what method
## can execute commands offered by ejabberd.
##
## By default "console commands" section allow executing all commands
## issued using ejabberdctl command, and "admin access" section allows
## users in admin acl that connect from 127.0.0.1 to  execute all
## commands except start and stop with any available access method
## (ejabberdctl, http-api, xmlrpc depending what is enabled on server).
##
## If you remove "console commands" there will be one added by
## default allowing executing all commands, but if you just change
## permissions in it, version from config file will be used instead
## of default one.
##
api_permissions:
  "console commands":
    from:
      - ejabberd_ctl
    who: all
    what: "*"
  "admin access":
    who:
      - access:
          - allow:
            - acl: loopback
            - acl: admin
      - oauth:
        - scope: "ejabberd:admin"
        - access:
          - allow:
            - acl: loopback
            - acl: admin
    what:
      - "*"
      - "!stop"
      - "!start"
  "public commands":
    who:
      - ip: "127.0.0.1/8"
    what:
      - "status"
      - "connected_users_number"
## Invite tokens are the registration gate; do not rate-limit retries by IP.
registration_timeout: infinity

##
## Define specific Access Rules in a virtual host.
##
## host_config:
##   "localhost":
##     access:
##       c2s:
##         - allow: admin
##         - deny
##       register:
##         - deny

###.  ================
###'  DEFAULT LANGUAGE

##
## language: Default language used for server messages.
##
language: "en"

###.  =======
###'  CAPTCHA

##
## Full path to a script that generates the image.
##
## xmp.pm: change this to the path the script lives in, it can be
## different than /opt/ejabberd.
captcha_cmd: "/usr/local/lib/ejabberd-26.4/priv/bin/captcha.sh"

##
## Host for the URL and port where ejabberd listens for CAPTCHA requests.
##
#captcha_host: "https://xmp.pm"
captcha_url: "https://xmp.pm/captcha"

##
## Limit CAPTCHA calls per minute for JID/IP to avoid DoS.
##
captcha_limit: 5

###.  ====
###'  ACME
##
## In order to use the acme certificate acquiring through "Let's Encrypt"
## an http listener has to be configured to listen to port 80 so that
## the authorization challenges posed by "Let's Encrypt" can be solved.
## 
## A simple way of doing this would be to add the following in the listening
## section and to configure port forwarding from 80 to 5280 either via NAT
## (for ipv4 only) or using frontends such as haproxy/nginx/sslh/etc.
##   - 
##    port: 5280
##    ip: "::"
##    module: ejabberd_http

# Traefik/cert-sync owns certificate issuance; keep ejabberd ACME silent.
acme:
  auto: false

   ## A contact mail that the ACME Certificate Authority can contact in case of
   ## an authorization issue, such as a server-initiated certificate revocation.
   ## It is not mandatory to provide an email address but it is highly suggested.
   # contact: "mailto:vesselwave@protonmail.com"  # xmp.pm: set this to your email


   ## The ACME Certificate Authority URL.
   ## This could either be:
   ##   - https://acme-v01.api.letsencrypt.org - (Default) for the production CA
   ##   - https://acme-staging.api.letsencrypt.org - for the staging CA
   ##   - http://localhost:4000 - for a local version of the CA
   # ca_url: "https://acme-v01.api.letsencrypt.org"

###.  =======
###'  MODULES

##
## Modules enabled in all ejabberd virtual hosts.
##
modules:
  mod_adhoc: {}
  mod_admin_extra: {}
  mod_announce: # recommends mod_adhoc
    access: announce
  mod_blocking: {} # requires mod_privacy
  mod_caps: {}
  mod_carboncopy: {}
  mod_client_state: {}
  mod_configure: {} # requires mod_adhoc
  ## mod_delegation: {} # for xep0356

  ## disco stands for xep0300: service discovery
  mod_disco: 
    server_info:
      -
       modules: all
       name: "abuse-addresses"
       urls: ["mailto:vesselwave@protonmail.com"]
      -
       modules: all
       name: "support-addresses"
       urls: ["xmpp:admin@xmp.pm", "mailto:vesselwave@protonmail.com"]
      #-
      # modules: all
      # name: "security-addresses"
      # urls: ["mailto:vesselwave@protonmail.com"]
  ## mod_echo: {}
  ## mod_irc: {}
  mod_bosh: {}
  ## mod_http_fileserver:
  ##   docroot: "/var/www"
  ##   accesslog: "/opt/ejabberd-18.09/logs/access.log"
  mod_http_upload:
    host: "upload.@HOST@"
    docroot: "@HOME@/upload"
    put_url: "https://xmpp.xmp.pm/upload"
    max_size: 104857600 # 100 MiB per file
    thumbnail: false # otherwise needs ejabberd to be compiled with libgd support
  mod_http_upload_quota:
    max_days: 7
  mod_last: {}
  ## XEP-0313: Message Archive Management
  ## You might want to setup a SQL backend for MAM because the mnesia ejabberd@localhost is
  ## limited to 2GB which might be exceeded on large servers
  mod_mam:
     assume_mam_usage: true
     default: always
     compress_xml: false
     user_mucsub_from_muc_archive: true
  mod_muc:
    host: "conference.@HOST@"
    access:
      - allow
    access_admin:
      - allow: admin
    access_create: muc_create
    access_persistent: muc_create
    default_room_options:
      allow_subscription: true
      mam: true
    max_users: 300
  mod_muc_admin: {}
  ## mod_muc_log: {}
  ## mod_multicast: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
    bounce_groupchat: true
  mod_ping: {}
  ## mod_pres_counter:
  ##   count: 5
  ##   interval: 60

  ## xep0016, related to blocking people, not the cryptography definition of
  ## "privacy".
  mod_privacy: {}

  ## xep0049
  mod_private: {}
  ## XEP-0065: SOCKS5 Bytestreams proxy for clients that need it.
  mod_proxy65: {}
  mod_pubsub:
    host: "pubsub.@HOST@"
    access_createnode: pubsub_createnode
    ## reduces resource consumption, but XEP incompliant
    # ignore_pep_from_offline: true
    ## XEP compliant, but increases resource consumption
    ignore_pep_from_offline: false
    last_item_cache: true
    max_items_node: 10
    plugins:
      - "flat"
      - "pep" # pep requires mod_caps
    force_node_config:
      "eu.siacs.conversations.axolotl.*":
        access_model: open
      "storage:bookmarks":
        access_model: whitelist
  mod_pubsub_serverinfo:
    pubsub_host: "pubsub.@HOST@"
  mod_push: {}
  mod_push_keepalive: {}
  mod_invites:
    access_create_account: configure
    landing_page: "https://xmp.pm/invites/{{ invite.token }}#{{ invite.uri }}"
  mod_register:
    ## Redirect plain in-band registration attempts to the web request workflow.
    redirect_url: "https://xmp.pm/request"
    ## Keep normal registration closed by allowing only mod_invites to create accounts.
    ## access/ip_access must still allow the username/source for mod_invites to succeed.
    allow_modules:
      - mod_invites
    ##
    ## Protect In-Band account registrations with CAPTCHA.
    ##
    captcha_protected: false
    ##
    ## Set the minimum informational entropy for passwords.
    ##
    password_strength: 32
    ##
    ## When a user registers, send a notification to
    ## these XMPP accounts.
    ##
    registration_watchers:
     - "admin@xmp.pm"
     #- "test@xmp.pm"
    ##
    ## Allow everyone to register
    ##
    ip_access: allnetworks
    access_from: allow
    #
    access: allnetworks
    # allow_modules above keeps non-invite in-band registration denied.
    # xmp.pm: if you want to disable all registrations, set this to none
    ##
    ## After successful registration, the user receives
    ## a message with this subject and body.
    ##
    welcome_message:
      subject: "Welcome to xmp.pm XMPP!"  # xmp.pm: set these to your welcome messages
      body: |-
             Welcome to xmp.pm XMPP service!
             We hope you enjoy our service!

             If you need support, write to admin@xmp.pm

             We try to be as compliant to the latest XEPs as possible to provide the best XMPP experience.

             Our configuration is available from the xmp.pm operator.
             It is based on configuration by LavaTech.

             Our service rules are simple:
             - Don't be an asshole
             - Don't be a nazi
             - Don't break any Ukrainian, Finnish, Turkish, (wherever you live) laws.
             - Don't abuse our services.
             - Don't do any attacks or any pentesting (without explicit approval from staff)
             If you do not agree to follow these rules, then please don't register. If you did register already, stop using this service and delete your account.             
  mod_roster: 
    versioning: true
  mod_shared_roster: {}
  mod_stats: {}
  mod_stun_disco:
    credentials_lifetime: 12h
    services:
        -
          host: xmpp.xmp.pm  # xmp.pm: public XMPP/STUN host
          port: 3478
          type: stun
          transport: udp
          restricted: false
        -
          host: xmpp.xmp.pm  # xmp.pm: public XMPP/STUN host
          port: 3478
          type: turn
          transport: udp
          restricted: true
        -
          host: xmpp.xmp.pm # xmp.pm: public XMPP/STUN host
          port: 5349
          type: stuns
          transport: tcp
          restricted: false
        -
          host: xmpp.xmp.pm # xmp.pm: public XMPP/STUN host
          port: 5349
          type: turns
          transport: tcp
          restricted: true
  ## mod_time: {}
  mod_vcard:
    search: false
  mod_vcard_xupdate: {}
  mod_avatar: {}
  mod_version: {}
  mod_stream_mgmt:
    resend_on_timeout: if_offline
  ##   Non-SASL Authentication (XEP-0078) is now disabled by default
  ##   because it's obsoleted and is used mostly by abandoned
  ##   client software
  ## mod_legacy_auth: {}
  ##   The module for S2S dialback (XEP-0220). Please note that you cannot
  ##   rely solely on dialback if you want to federate with other servers,
  ##   because a lot of servers have dialback disabled and instead rely on
  ##   PKIX authentication. Make sure you have proper certificates installed
  ##   and check your accessibility at https://check.messaging.one/
  mod_s2s_dialback: {}
  mod_http_api: {}
  mod_fail2ban: {}
  mod_mqtt: {}
  ## MIX disabled for launch: MUC covers group chat; MIX service subdomain/cert not provisioned.

##
## Enable modules with custom options in a specific virtual host
##
## host_config:
##   "localhost":
##     modules:
##       mod_echo:
##         host: "mirror.localhost"

##
## Enable modules management via ejabberdctl for installation and
## uninstallation of public/private contributed modules
## (enabled by default)
##

allow_contrib_modules: true

